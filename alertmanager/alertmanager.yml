global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'your-app-password'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
        headers:
          subject: '🔴 CRITICAL: {{ .GroupLabels.alertname }} on {{ .GroupLabels.instance }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
        headers:
          subject: '⚠️ WARNING: {{ .GroupLabels.alertname }} on {{ .GroupLabels.instance }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
